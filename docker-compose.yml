services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # caso tenho erro de permissão no volume
  dpkeys-init:
    image: busybox:1.36
    restart: "no"
    command: sh -c "mkdir -p /keys && chmod -R 777 /keys"
    volumes:
      - dp_keys:/keys

  web:
    image: web-ssr:dev
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - dp_keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  postgres_data:
  dp_keys:
